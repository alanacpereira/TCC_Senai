
name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Publicar no servidor
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar banco da plataforma
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          php <<'PHP'
          <?php
          $path = 'plataforma/config/app.php';
          $source = file_get_contents($path);
          if ($source === false) {
              fwrite(STDERR, "Não foi possível ler a configuração da plataforma.\n");
              exit(1);
          }

          $values = [
              'DB_HOST' => getenv('DB_HOST'),
              'DB_PORT' => getenv('DB_PORT'),
              'DB_NAME' => getenv('DB_NAME'),
              'DB_USER' => getenv('DB_USER'),
              'DB_PASSWORD' => getenv('DB_PASS'),
          ];

          foreach ($values as $name => $value) {
              if ($value === false || ($name !== 'DB_PASSWORD' && $value === '')) {
                  fwrite(STDERR, "Secret ausente ou vazio: {$name}.\n");
                  exit(1);
              }
          }

          $replacements = [
              'getenv("DB_HOST") ?: "localhost"' => var_export($values['DB_HOST'], true),
              'getenv("DB_PORT") ?: "3308"' => var_export($values['DB_PORT'], true),
              'getenv("DB_NAME") ?: "palavra_a_bordo"' => var_export($values['DB_NAME'], true),
              'getenv("DB_USER") ?: "root"' => var_export($values['DB_USER'], true),
              'getenv("DB_PASSWORD")' => var_export($values['DB_PASSWORD'], true),
          ];

          foreach ($replacements as $search => $replacement) {
              if (substr_count($source, $search) !== 1) {
                  fwrite(STDERR, "Formato inesperado na configuração da plataforma.\n");
                  exit(1);
              }
              $source = str_replace($search, $replacement, $source);
          }

          if (file_put_contents($path, $source) === false) {
              fwrite(STDERR, "Não foi possível preparar a configuração da plataforma.\n");
              exit(1);
          }
          PHP

      - name: Configurar banco do Jogo 1
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          sed -i "s|getenv(\"DB_HOST\") ?: \"localhost\"|\"$DB_HOST\"|g" jogo1/config/database.php
          sed -i "s|getenv(\"DB_PORT\") ?: \"3308\"|\"$DB_PORT\"|g" jogo1/config/database.php
          sed -i "s|getenv(\"DB_NAME\") ?: \"palavra_a_bordo\"|\"$DB_NAME\"|g" jogo1/config/database.php
          sed -i "s|getenv(\"DB_USER\") ?: \"root\"|\"$DB_USER\"|g" jogo1/config/database.php
          sed -i '/$password = getenv("DB_PASSWORD");/c\        $this->password = getenv("DB_PASSWORD") ?: "";' jogo1/config/database.php
          sed -i "s|getenv(\"DB_PASSWORD\")|\"$DB_PASS\"|g" jogo1/config/database.php
          sed -i '/$this->password = $password === false ? "" : $password;/d' jogo1/config/database.php

      - name: Configurar banco do Jogo 2
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          sed -i "s|getenv(\"DB_HOST\") ?: \"localhost\"|\"$DB_HOST\"|g" jogo2/config/database.php
          sed -i "s|getenv(\"DB_PORT\") ?: \"3308\"|\"$DB_PORT\"|g" jogo2/config/database.php
          sed -i "s|getenv(\"DB_NAME\") ?: \"palavra_a_bordo\"|\"$DB_NAME\"|g" jogo2/config/database.php
          sed -i "s|getenv(\"DB_USER\") ?: \"root\"|\"$DB_USER\"|g" jogo2/config/database.php
          sed -i "s|getenv(\"DB_PASSWORD\")|\"$DB_PASS\"|g" jogo2/config/database.php

      - name: Validar PHP
        run: |
          find plataforma jogo1 jogo2 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validar JavaScript
        run: |
          find plataforma jogo1 jogo2 -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Publicar via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /palavraabordo.totalh.net/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/database/**
            **/*.sql
            **/*.md
            **/*.docx
            **/*.bak
            **/.env*
            __auth_test_router.php
